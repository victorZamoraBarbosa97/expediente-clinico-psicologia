[package]
name = "consultorio"
version = "1.0.0"
description = "Expediente clinico para psicologia, 100 % local y sin internet (Tauri 2 + React + SQLite)"
authors = ["Victor Zamora"]
license = "MIT"
repository = "https://github.com/victorZamoraBarbosa97/expediente-clinico-psicologia"
edition = "2021"

[lib]
name = "consultorio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
