name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Tipos, lint, tests y build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  rust:
    name: Rust (clippy y tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # tauri-build necesita que exista ../dist (frontendDist) al compilar.
      - run: npm ci
      - run: npx vite build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
